name: One-shot desktop update 2026-09-16

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update price history and dashboard index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, json
          today = '2026-09-16'
          timestamp = '2026-09-16T22:01:00+02:00'
          csv_path = Path('data/price_history.csv')
          with csv_path.open('r', encoding='utf-8', newline='') as f:
              rows = list(csv.reader(f))
          header = rows[0]
          existing = [r for r in rows[1:] if not (r and r[0] == today)]
          new_rows = [
              [today,'22:01','CSL Sprint 5753','New','CSL Computer','DE','1299','Ryzen 7 8700F','RTX 5060 Ti 16GB','16','1000','500W 80+ Bronze','mATX / AM5','24mo manufacturer; optional extension','Yes','8.4','8.6','8.8','9.4','1','✅很值','1450','10.4','→ 历史低位持平','https://www.csl-computer.com/pc-systeme/amd/pc-csl-sprint-5753-ryzen-7.html','Official CSL direct; ASUS PRIME B840M-A WIFI; AM5/DDR5; no OS; prioritize 32/64GB RAM; standard parts; 500W PSU is future high-power-GPU constraint.'],
              [today,'22:01','KIEBEL Invader XS V','New','kiebel via MediaMarkt','DE','1289','Ryzen 7 5700X','RTX 5060 Ti 8GB','32','1000','Aerocool Aero 650W 80+ Bronze','mATX / AM4 A520','24mo Service24 basic stated on product page','Yes','4.5','7.8','8.7','9.0','3','✅很值','1499','14.0','→ 促销低位持平','https://www.mediamarkt.de/de/product/_kiebel-allround-gaming-pc-16-gb-ram-500-gb-ss-76871438.html','Marketplace: actual seller/shipper kiebel; ASUS PRIME A520M-A II/CSM; 32GB DDR4; Win11; Wi-Fi ac USB; MediaMarkt voluntary-return terms do not automatically apply to third-party marketplace sellers.'],
              [today,'22:01','GameMachines Trinity 5700X / RTX5060Ti 8GB','New','GameMachines via MediaMarkt','DE','1079','Ryzen 7 5700X','RTX 5060 Ti 8GB','16','1000','Not disclosed on fetched product page','Tower / AM4; motherboard not disclosed','Marketplace seller terms; verify exact commercial warranty','Yes','4.0','7.2','8.6','9.2','6','✅很值','1299','16.9','→ 昨日新低后持平','https://www.mediamarkt.de/de/product/_gamemachines-trinity-rgb-kuhler-gaming-pc-mit-amd-ryzentm-7-5700x-prozessor-16-gb-ram-1000-gb-ssd-nvidia-geforce-rtxtm-5060-ti-windows-11-pro-170126496.html','Marketplace: actual seller/shipper GameMachines; Win11 Pro and Wi-Fi; current €1079 versus product-page 30-day low €1299; motherboard/PSU transparency remains weak.'],
