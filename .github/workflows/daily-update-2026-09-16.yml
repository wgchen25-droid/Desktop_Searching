              [today,'22:01','Captiva Highend Gaming R93-435','New','NEXOC Store GmbH / CAPTIVA','DE','1445.99','Ryzen 7 5700X','RTX 5070 12GB','32','1000','MSI MAG A850GL 850W','Tower / AM4 B550M','24mo CAPTIVA / seller support','Yes','5.8','8.4','8.8','9.2','1','✅很值','1515','4.6','→ 32GB+RTX5070 跟踪低位持平','https://www.nexoc-store.de/pc-systeme/pcs/gaming-pcs/captiva-pc-highend-gaming-r93-435-ryzen-7-5700x-rtx5070-12gb-gddr7-ssd-1tb-32gb-wlan-windows-11-home-64-bit','NEXOC direct; free shipping; 2-3 working days; B550M/AM4 DDR4, Wi-Fi, Win11 Home, 850W PSU. Geizhals current range begins at €1445.99.'],
              [today,'22:01','Captiva Workstation I10-2574','New','notebooksbilliger.de','DE','1299','Core Ultra 7 270K Plus','Intel integrated graphics','32','1000','550W (tracked model spec)','Tower / B860','NBB statutory support; optional 3/5yr protection','Yes','8.3','8.9','9.4','8.8','1','🟡普通好价','1299','0.0','→ Campus 专享价持平','https://www.notebooksbilliger.de/captiva%2Bpc%2Bworkstation%2Bi10%2B2574%2B923706','Campus members only at €1299; 32GB DDR5, B860, Wi-Fi6, Win11 Pro; strong CPU/VM/RDP route but no NVIDIA CUDA GPU.'],
              [today,'22:01','SYSTEMTREFF 5700X / RTX5060Ti16 / 32GB via MediaMarkt','New','SYSTEMTREFF via MediaMarkt','DE','1534.90','Ryzen 7 5700X','RTX 5060 Ti 16GB','32','1000','be quiet! System Power 11 B 650W 80+ Bronze','mATX / AM4 A520','Marketplace seller SYSTEMTREFF; verify exact warranty term','Yes','4.8','8.1','9.0','8.5','3','🟡普通好价','1600','4.1','New tracked comparator','https://www.mediamarkt.de/de/product/_systemtreff-gaming-gaming-pc-ryzentm-7-5700x-prozessor-32-gb-ram-1000-gb-ssd-nvidia-geforce-rtxtm-5060-ti-windows-11-pro-175213072.html','Actual seller/shipper SYSTEMTREFF; MSI A520M-A PRO; 32GB DDR4; Crucial E100 1TB; Win11 Pro; 1GbE + Wi-Fi/BT USB; product-page 30-day low €1609.90.'],
              [today,'22:01','AlzaPC GameBox Prime U5 / RTX5070 / 32GB / 2TB','New','Alza.de / AlzaPC','EU/DE','1619','Core Ultra 5 225F','RTX 5070 12GB','32','2000','750W','Midi Tower / B860','36mo; 10-workday repair promise','Yes','8.5','8.8','8.8','8.8','3','🟡普通好价','1700','4.8','→ 近上限价持平','https://www.alza.de/alzapc-gamebox-prime-u5-rtx5070-32gb-ram-2tb-ssd-kein-betriebssystem-d13220921.htm','B860, 4 DIMM (2 populated), 2 M.2, 2.5GbE, WLAN, no OS; €19 above requested €1600 stretch ceiling, so watch rather than buy today.'],
              [today,'22:01','MemoryPC 7500F / RTX5070 / 32GB B850','New','MemoryPC','DE','1899','Ryzen 5 7500F','RTX 5070 12GB','32','1000','750W class (tracked configuration)','ATX / AM5 B850','Seller/manufacturer support; free return noted on page','Yes','9.2','8.3','9.2','6.5','1','❌跳过','1700','-11.7','→ 高位持平','https://www.memorypc.de/p/gaming-pc-amd-ryzen-5-7500f-rtx-5070-32-gb-ddr5-557100/','In stock, 3-5 workdays; MSI Pro B850-S WIFI6E and 32GB DDR5 are excellent upgrade foundations, but current €1899 is not competitive.'],
          ]
          with csv_path.open('w', encoding='utf-8', newline='') as f:
              writer = csv.writer(f)
              writer.writerow(header)
              writer.writerows(existing)
              writer.writerows(new_rows)
          idx_path = Path('reports/index.json')
          idx = json.loads(idx_path.read_text(encoding='utf-8'))
          idx['updated_at'] = timestamp
          idx['reports'] = [r for r in idx.get('reports', []) if r.get('date') != today]
          idx['reports'].insert(0, {'date': today, 'title': 'Daily Angebot — CSL €1,299 holds; Cyberport adds direct-retail 16GB-VRAM comparator at €1,389', 'summary': '总冠军仍是 CSL Sprint 5753 €1,299：AM5 + RTX5060Ti 16GB，✅ 很值但稀缺度 1/10。最佳非同商家挑战者为 kiebel/MediaMarkt KIEBEL €1,289。今天新增 Cyberport 直售 Hyrican Rockstar 8002 €1,389（RTX5060Ti 16GB + Win11），售后更省心但 A520/AM4/400W/16GB 使五年升级明显弱于 CSL；GameMachines €1,079 预算异常价继续持平。7日小幅改善后横盘，30日样本仍不足。', 'rating': '✅ 很值', 'path': 'reports/2026-09-16.md', 'url': 'https://github.com/wgchen25-droid/Desktop_Searching/blob/main/reports/2026-09-16.md'})
          idx_path.write_text(json.dumps(idx, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price_history.csv reports/index.json
          git commit -m "data: append 2026-09-16 desktop candidates"
          git push
