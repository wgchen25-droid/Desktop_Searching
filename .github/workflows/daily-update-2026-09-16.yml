## 售后、网络、散热与远程主机

CSL 是德国直售，历史核验为 24 个月厂家保修可扩到 36 个月；标准件布局对长期无人值守维护更友好。KIEBEL 商品页明确写 24 个月免费 Service24 basic，但它是 MediaMarkt Marketplace 第三方交易；MediaMarkt 页面本身也注明 Marketplace 购买接受对应卖家的 AGB，平台的自愿 30 天退货并非当然适用于第三方卖家。Cyberport 是直接零售商，当前服务页明确给私人客户 30 天免费退货，对“不想折腾售后”的路线是明显优势。

CSL 的 B840M/Wi-Fi 平台此前已核验具备标准 mATX、4 个 DDR5 DIMM、多个 M.2、2.5GbE 与 Wi-Fi 6E。出厂 16GB RAM 是工程用途的明确短板，建议直接把 32GB/64GB 升级计入购机成本。500W Bronze 足以配当前 RTX5060Ti，但未来升级高功耗 GPU 时应同步升级 PSU。

地下室/角落长期运行仍建议固定走有线网，Wi-Fi 只作备用管理链路；保留 UPS/自动开机、远程电源恢复、温度与灰尘管理更重要。原生 Microsoft Remote Desktop 要作为被控 Host，应使用 Windows 11 Pro；CSL 不带 OS，因此需要自己安装合适版本。

## 相对固定 Reference：HP Z2 Tower G9 / i7-12700K / 32GB / UHD 770

`data/reference_systems.csv` 中的 HP Z2 Tower G9 仍然没有价格，只作为固定硬件 Reference；**没有写入 `price_history.csv`，也没有参与 7 日/30 日均值、市场折扣或历史最好价统计。**

CSL 5753 **不是 CPU 升级型换机**。同一 PassMark 数据库当前约为：Ryzen 7 8700F CPU Mark 30,882、单线程 3,873；i7-12700K CPU Mark 34,247、单线程 4,003。按同库计算，8700F 分别约低 **9.8% / 3.2%**。这只是合成基准，不能直接等同于 ANSYS、Abaqus、MATLAB、SolidWorks 等真实 workload，但足以说明 CPU-only solver、编译、CPU 渲染不能把 CSL 当作 Reference 的 CPU 升级。

真正的结构性升级是 **UHD 770 → RTX 5060 Ti 16GB**。NVIDIA 公布 RTX 5060 Ti 为 4608 CUDA cores，并提供 8GB/16GB GDDR7 版本。CUDA、OptiX、NVIDIA GPU solver、本地 AI、GPU rendering、复杂 3D 视口和显存敏感场景是换机的主要理由；没有针对你的具体工程软件统一可靠的百分比，因此不编造“快几倍”。

RAM 则从 Reference 的 32GB 降到 CSL 开箱 16GB，是明确退步，必须优先补。功耗方面 8700F 的 CPU 功耗等级较低，但加入独显后，GPU 长负载下整机发热会高于只用 UHD770 的 Reference，因此地下室应特别重视进排风、灰尘和定期维护。五年升级空间方面，CSL 的 AM5/B840/DDR5 明显优于 AM4/A520 候选，但 500W PSU 仍是未来高功耗 GPU 的第一限制。

