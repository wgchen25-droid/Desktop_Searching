name: Append 2026-09-22 price history

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Deploy dashboard to GitHub Pages", ".github/workflows/daily-update-2026-09-16.yml"]
    types: [completed]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append 2026-09-22 rows if missing
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^2026-09-22,' data/price_history.csv; then
            echo '2026-09-22 rows already present; nothing to do.'
            exit 0
