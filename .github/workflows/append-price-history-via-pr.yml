name: Merge staged desktop price history

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/price-history-trigger/**'

permissions:
  contents: write

jobs:
  merge-staged-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append staged rows not yet in main history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          hist = Path('data/price_history.csv')
          text = hist.read_text(encoding='utf-8')
          changed = False
          for date in ('2026-09-22', '2026-09-23'):
              staged = Path(f'data/price_history_{date}.pending.csv')
              if not staged.exists():
                  continue
              if any(line.startswith(date + ',') for line in text.splitlines()):
                  continue
              if text and not text.endswith('\n'):
                  text += '\n'
              text += staged.read_text(encoding='utf-8').rstrip('\n') + '\n'
              changed = True
          if changed:
              hist.write_text(text, encoding='utf-8')
          PY
      - name: Commit and push main history
        shell: bash
        run: |
          if git diff --quiet -- data/price_history.csv; then
            echo 'No history changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/price_history.csv
          git commit -m 'data: append staged 2026-09-22 and 2026-09-23 history'
          git push origin HEAD:main
