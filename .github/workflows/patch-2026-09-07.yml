name: Patch verified daily scan 2026-09-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-2026-09-07.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct daily CSV and dashboard selection
        run: |
          python - <<'PY'
          import csv, re
          from pathlib import Path
          p = Path('data/price_history.csv')
          with p.open(newline='', encoding='utf-8') as f:
              rd = csv.DictReader(f)
              fields = rd.fieldnames
              rows = list(rd)
          rows = [r for r in rows if not (r.get('date') == '2026-09-07' and r.get('model','').startswith('MIFCOM Counter-Strike'))]
          for r in rows:
              if r.get('date') != '2026-09-07':
                  continue
              if r.get('model') == 'Captiva Highend Gaming R93-435':
                  r['market_reference_eur'] = '1515'
                  r['discount_vs_market_pct'] = '4.6'
                  r['notes'] = 'Best different-seller challenger and new absolute tracked low for 32GB+RTX5070; direct NEXOC seller; €1445.99 free shipping, 2-3 business days, Win11 Home and Wi-Fi; Idealo shows seven current offers from €1445.99 to €1559.79; AM4/B550/DDR4 limits five-year CPU-platform upgrades; NEXOC 14-day withdrawal with consumer paying direct return shipping; CAPTIVA two-year warranty.'
              if r.get('model','').startswith('Acer Predator Orion 3000'):
                  r['market_reference_eur'] = '1249'
                  r['discount_vs_market_pct'] = '4.0'
                  r['notes'] = 'Strict-budget GPU outlier; actual seller nordiva-shop0 via eBay; exact SKU Idealo shows €1199 incl shipping and three new offers in €1199-1269 range; €50 below prior tracked €1249; hardware value is exceptional but marketplace warranty clarity and OEM/H610/DDR4/16GB expansion limits make this conditional rather than a five-year workstation base.'
          def add(model, seller, price, cpu, gpu, ram, storage, psu, form, warranty, upgrade, eng, remote, value, rarity, rating, ref, disc, trend, url, notes):
              if any(r.get('date') == '2026-09-07' and r.get('model') == model for r in rows):
                  return
              rows.append(dict(zip(fields, ['2026-09-07','22:45',model,'New',seller,'DE',str(price),cpu,gpu,str(ram),str(storage),psu,form,warranty,'yes',str(upgrade),str(eng),str(remote),str(value),str(rarity),rating,str(ref),str(disc),trend,url,notes])))
          add('CSL Speed 4574 Core Ultra 5 225F / RTX 5070','CSL Computer',1399.00,'Intel Core Ultra 5 225F','NVIDIA GeForce RTX 5070 12GB',16,1000,'700W BoostBoxx Power Boost 80+ Gold ATX2.53','Mid Tower / H810M','24 months manufacturer warranty; 36 months optional; lifetime technical support',5.8,8.8,8.7,9.3,2,'✅ 很值',1500,6.7,'→ 持平','https://www.csl-computer.com/gaming-pcs/gaming-pcs-1000-1500-euro/pc-csl-speed-4574-core-ultra-5.html','Official page rechecked at €1399 with 3-5 business-day dispatch; strong RTX5070 value, but 16GB RAM, H810M, no Wi-Fi and no OS reduce long-term remote-workstation completeness.')
          add('OMIXIMO Ryzen 7 5700 / RTX 5070 32GB/1TB','Omiximo B.V. via MediaMarkt',1549.00,'AMD Ryzen 7 5700','NVIDIA GeForce RTX 5070 12GB',32,1000,'Not disclosed','Tower / board not disclosed','Marketplace seller terms; MediaMarkt advertises 30-day voluntary return subject to marketplace conditions',4.5,7.9,8.6,8.4,4,'🟡 普通好价',1550,0.1,'→ 市场锚点','https://www.mediamarkt.de/de/product/_omiximo-ryzen-7-5700-rtx-5070-32gb1tb-gaming-pc-ryzentm-7-32-gb-ram-1-tb-ssd-nvidia-geforce-rtxtm-5070-windows-11-pro-168998229.html','Actual seller and shipper Omiximo B.V.; €1549 free shipping; Ryzen 7 5700, RTX5070, 32GB, 1TB, Win11 Pro; motherboard/PSU not disclosed, so component transparency and upgrade confidence are weaker.')
          add('MemoryPC Ryzen 5 7500F / RTX 5070 32GB','MemoryPC',1879.00,'AMD Ryzen 5 7500F','NVIDIA GeForce RTX 5070 12GB',32,1000,'750W be quiet! System Power 11 M 80+ Gold','Mid Tower / MSI PRO B850-S WIFI6E','Manufacturer warranty; German assembly/support',9.2,8.3,9.2,7.1,2,'❌ 跳过',1700,-10.5,'→ 持平偏贵','https://www.memorypc.de/p/gaming-pc-amd-ryzen-5-7500f-rtx-5070-32-gb-ddr5-557100/','Official page rechecked at €1879; excellent B850/Wi-Fi/32GB/750W Gold foundation, but far above today HP/Captiva/CSL options.')
          add('SYSTEMTREFF Ryzen 5 7500F / RTX 5070 32GB','SYSTEMTREFF',1909.90,'AMD Ryzen 5 7500F','NVIDIA GeForce RTX 5070 12GB',32,1000,'750W be quiet! System Power 11 M Gold','Mid Tower / B850-class','3 years + 30-day return',9,7.7,9,6.9,2,'❌ 跳过',1800,-6.1,'↓ 恶化 vs historical same model','https://www.systemtreff.de/Gaming-PC-AMD-Ryzen-5-7500F-32GB-DDR5-GeForce-RTX-5070-12GB-1TB-4088','Official page €1949.90 less €40 code GAMING26 = about €1909.90 effective; good standard platform and service, but same tracked model was €1719.90 on 2026-08-30.')
          with p.open('w', newline='', encoding='utf-8') as f:
              wr = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              wr.writeheader(); wr.writerows(rows)
          appp = Path('assets/app.js')
          app = appp.read_text(encoding='utf-8')
          replacement = """function pickBest(rows) {
            if (!rows.length) return null;
            const latest = rows.reduce((m, r) => r._dt > m ? r._dt : m, rows[0]._dt);
            const same = rows.filter((r) => r.date === latest.toISOString().slice(0, 10));
            const tier = (r) => { const c = ratingClass(r.rating); return c === 'fire' ? 4 : c === 'good' ? 3 : c === 'normal' ? 2 : 1; };
            const score = (r) => tier(r) * 100 + (r.value_score ?? 0) * 4 + (r.engineering_score ?? 0) * 2 + (r.remote_score ?? 0) + (r.upgrade_score ?? 0) * 2 + (r.rarity_score ?? 0) * .2;
            return same.sort((a, b) => score(b) - score(a))[0] || rows[0];
          }"""
          app2, n = re.subn(r'function pickBest\(rows\) \{.*?\n\}\n\nfunction setMetrics', replacement + '\n\nfunction setMetrics', app, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('pickBest patch failed')
          appp.write_text(app2, encoding='utf-8')
          PY
      - name: Commit verified result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price_history.csv assets/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Correct verified desktop deal data for 2026-09-07"
          git push origin main
