## 相对固定 Reference 的实际升级 / 退步

固定 Reference 仍是 **HP Z2 Tower G9 Workstation：Core i7-12700K / 32GB / Intel UHD Graphics 770**，且**无价格**。它继续只用于硬件比较，不进入 `price_history.csv`，也不参与 7 天/30 天均值、市场折扣或历史最好价。

### HP OMEN 相对 Z2

**CPU：不是无条件升级。** Intel 官方规格显示 i7-12700K 为 12 核（8P+4E）/20 线程，处理器基础功耗 125W、最大睿频功耗 190W；AMD 官方规格显示 Ryzen 7 8700F 为 8 核/16 线程、65W 默认 TDP。没有用未经核验的百分比去声称谁在你的具体工程 workload 快多少。对于高度并行的 CPU-only solver、编译和 CPU 渲染，Z2 的 12700K 仍可能很有竞争力；8700F 的优势更偏现代 AM5 平台与较低 CPU 标称功耗，而不是“必然更快”。

**GPU：这是最实质的升级。** 从 UHD 770 到 RTX 5070 12GB，CUDA/OptiX、GPU 渲染、AI、GPU 求解器和大型 3D 视口会获得能力级别的提升。NVIDIA 官方规格给 RTX 5070 6144 CUDA cores、12GB GDDR7、最多四个独立显示器。没有给出“快几倍”，因为不同工程软件差异很大。

**RAM：持平。** 两边都是 32GB；OMEN 的 4 DIMM + DDR5 是后续扩容加分项。对于大型有限元、CFD、大程序集或多 VM，64GB 仍是很可能的下一步升级。

**远程主机：OMEN 的图形/编码能力更强，但 Z2 的 workstation 属性仍有价值。** OMEN 适合 GPU 加速桌面、远程 3D 和多屏编码；长期无人值守时建议优先有线网络、关闭不必要睡眠、设置自动开机/断电恢复，并验证 BIOS 是否提供所需恢复选项。Windows 11 Home 若要使用微软原生 RDP 作为被控 Host，通常需要升级到 Pro 或改用其他远程方案。

**功耗/散热：不要只看 CPU TDP。** 8700F 的 65W CPU 标称功耗低于 12700K 的 125W/190W规格，但 OMEN 新增 RTX 5070，GPU 满载时整机功耗必然远高于只用 UHD 770 的 Z2。地下室长期运行要关注的是机箱风道、灰尘过滤、风扇/泵可靠性和 GPU 负载，而不是单看 CPU 数字。

**五年升级：OMEN 的 AM5/B650/DDR5 路线更现代，但标准件透明度不如真正 ATX 自组式整机。** 如果 Z2 当前瓶颈只是 CPU 多核而不是 GPU，今天不值得仅为 OMEN 换机；如果瓶颈是 CUDA、GPU 渲染、AI 或大型 3D，OMEN 才是明确的实际升级。

