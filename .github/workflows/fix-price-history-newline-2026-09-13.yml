name: Fix price history newline 2026-09-13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-price-history-newline-2026-09-13.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore CSV row boundary before 2026-09-13
        shell: python
        run: |
          from pathlib import Path
          p = Path('data/price_history.csv')
          s = p.read_text(encoding='utf-8')
          needle = 'current value is poor."2026-09-13,22:00,'
          if needle not in s:
              raise SystemExit('Expected joined row boundary not found')
          s = s.replace(needle, 'current value is poor."\n2026-09-13,22:00,', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit newline fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/price_history.csv
          git commit -m 'Fix CSV row boundary for 2026-09-13'
          git push origin main
