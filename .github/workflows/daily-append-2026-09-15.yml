今天重新扫描了 CSL、SYSTEMTREFF、MemoryPC、Dubaro、Alternate/Outlet、notebooksbilliger.de、Cyberport、MediaMarkt、Saturn、Amazon.de/Marketplace、Dell、HP、Lenovo、x-kom、Alza、NEXOC，并用 Idealo、Geizhals、Mydealz 做异常价格发现。Alternate Outlet 当前抓到的 RTX5070 B-Ware Thermaltake 为 €2,478，配置虽强但完全脱离预算；Cyberport 的类似 32GB/RTX5060Ti16GB Captiva 约 €1,799；Dubaro 的 AM5/32GB/RTX5060Ti16GB 约 €1,929；HP 官方的 32GB/RTX5060Ti16GB OMEN 约 €1,699 且缺货；Dell/Lenovo 当前可核验的独显塔机明显更贵或不可用；x-kom RTX5070 完整机也显著高于本轮优选。Amazon/Marketplace 与价格比较站出现若干看起来异常的摘要价，但未能回到可核验的精确商家商品页、卖家和配置的，不写入正式价格历史。

## 相对固定 Reference：HP Z2 Tower G9 / i7-12700K / 32GB / UHD 770

Reference 的 `price_eur` 仍为空，继续只作为固定硬件基准，**没有写入 price_history.csv，也没有参与 7日/30日均值、折扣或历史最低价统计**。

对 CSL 5753 而言，CPU 不是明确升级：8700F 是 8核/16线程、65W 级 AM5 CPU；Reference 的 12700K 是 12核/20线程，并拥有更高的长期已知多线程余量。公开合成基准通常把 12700K 放在 8700F 之上，因此 CPU-only solver、编译、CPU 渲染等场景不应因为换 CSL 就期待加速。这里不把合成 benchmark 百分比直接当作 ANSYS/Abaqus/SolidWorks/MATLAB 的实际提升。

真正的结构性升级是 UHD 770 → RTX 5060 Ti 16GB：CUDA、OptiX、NVIDIA GPU solver、本地 AI、GPU rendering、大纹理与复杂 3D 视口明显更适合。反过来，CSL 开箱只有 16GB RAM，较 Reference 的 32GB 是明确退步，因此把内存升到 32GB/64GB 应直接算入购机计划。

远程主机方面，CSL 有 Wi-Fi 6E 作为备用管理链路，但长期放地下室仍建议使用有线 LAN；它没有预装 OS，如果要用微软原生 Remote Desktop 作为被控 Host，建议装 Windows 11 Pro。多屏输出由 RTX 显卡承担。功耗/散热方面，8700F 的 CPU 功耗等级较低，但加上独显后，GPU 长时高负载下整机热量会明显高于只用 UHD770 的 Reference；地下室主机应保持良好进排风、留出显卡散热空间并定期清灰。

