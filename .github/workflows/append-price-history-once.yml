name: Append price history once

on:
  push:
    branches: [main]
    paths:
      - 'data/price_history_append.csv'

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append verified daily rows
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/price_history_append.csv ]; then
            echo 'No append file; nothing to do.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          dst = Path('data/price_history.csv')
          src = Path('data/price_history_append.csv')
          old = dst.read_text(encoding='utf-8')
          add = src.read_text(encoding='utf-8').strip('\r\n')
          marker = '2026-09-17,22:01,GameMachines Flow Ryzen 7 5700X / RTX 5060 Ti 16GB / 32GB'
          if marker not in old:
              dst.write_text(old.rstrip('\r\n') + '\n' + add + '\n', encoding='utf-8')
          else:
              print('Rows already present; skip append')
          PY
          if git diff --quiet -- data/price_history.csv; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/price_history.csv
          git commit -m 'data: append 2026-09-17 desktop offers'
          git push
