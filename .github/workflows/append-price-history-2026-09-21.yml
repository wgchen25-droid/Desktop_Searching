                  },
                  {
                      'date':'2026-09-21','time':'22:00','model':'Hyrican GAMEMAX Infinity Mini BK 7796 PCK07796','condition':'New','seller':'Cyberport / Hyrican','country':'DE','price_eur':'1259.00','cpu':'AMD Ryzen 7 5700X','gpu':'NVIDIA GeForce RTX 5060 Ti 16GB','ram_gb':'16','storage_gb':'1000','psu':'400W (Cyberport direct datasheet)','form_factor':'Midi Tower / AM4','warranty':'Cyberport direct sale; manufacturer warranty framework; 30-day free return','shipping_to_germany':'yes','upgrade_score':'4.4','engineering_score':'8.0','remote_score':'8.6','value_score':'9.1','rarity_score':'2','rating':'✅ 很值','market_reference_eur':'1275','discount_vs_market_pct':'1.3','trend_vs_history':'→ current price flat; direct-vendor 400W spec overrides prior secondary 750W claim','product_url':'https://www.cyberport.de/gaming/gaming-pcs/pdp/1125-4FJ/Hyrican-GAMEMAX-Infinity-Mini-BK--7796--Gaming-PC-Ryzen-7-5700X-16GB-1TB-SSD-RTX-5060Ti-Win11.html','notes':'Cyberport direct; €1259, immediately available, free return. 5700X/RTX5060Ti16/16GB DDR4/1TB/Win11 Home/WLAN. Direct Cyberport datasheet lists 400W, 2 DIMM/max64GB, 1GbE and Wi-Fi5; AM4/DDR4 and low PSU headroom weaken five-year upgrades.'
