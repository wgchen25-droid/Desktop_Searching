name: Append desktop deal data 2026-09-21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/append-price-history-2026-09-21.yml'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append price history and update report index
        shell: bash
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          csv_path = Path('data/price_history.csv')
          with csv_path.open('r', encoding='utf-8', newline='') as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames
              existing = list(reader)

          if not any(r.get('date') == '2026-09-21' for r in existing):
              rows = [
                  {
