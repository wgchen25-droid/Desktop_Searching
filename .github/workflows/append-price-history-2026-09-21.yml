              ]
              with csv_path.open('a', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fieldnames, extrasaction='ignore', lineterminator='\n')
                  for row in rows:
                      w.writerow(row)

          index_path = Path('reports/index.json')
          data = json.loads(index_path.read_text(encoding='utf-8'))
          if not any(r.get('date') == '2026-09-21' for r in data.get('reports', [])):
              entry = {
                  'date': '2026-09-21',
                  'title': 'Daily Angebot — €1,159 Acer RTX 5070 refurb holds; current new market rises while CSL stays the long-term platform challenger',
                  'summary': '强制跨商家扫描后，今日总冠军继续是 GG-Net GmbH / AcerSonderposten.de 的 Acer Predator Orion 3000-665 DG.E4UEG.003 refurbished：i5-14400F + RTX5070 12GB + 16GB + 1TB + 850W + Win11 Home，€1,159 + Versand，✅ 很值 / 稀缺度6。当前同 SKU 新机市场约€1,249–1,269，明显高于仓库 New 历史最低€1,199，因此 refurb 相对当前新机约低8.7%。最佳非同商家挑战者继续 CSL Sprint 5753 €1,299：贵€140但AM5/B840/DDR5、标准mATX、4 DIMM、3 M.2、2.5GbE/Wi-Fi6E和2年保修显著增强五年升级性。今天主冠军持平、外围略恶化；7日综合获取价值改善；30日样本仍不足。固定 HP Z2 reference 继续严格排除价格统计。',
                  'rating': '✅ 很值',
                  'path': 'reports/2026-09-21.md',
                  'url': 'https://github.com/wgchen25-droid/Desktop_Searching/blob/main/reports/2026-09-21.md'
              }
              data['reports'] = [entry] + data.get('reports', [])
          data['updated_at'] = '2026-09-21T22:00:00+02:00'
          index_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name "desktop-deal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price_history.csv reports/index.json
          if git diff --cached --quiet; then
            echo "No data changes needed"
            exit 0
          fi
          git commit -m "data: append 2026-09-21 desktop prices [skip ci]"
          git push origin HEAD:main
